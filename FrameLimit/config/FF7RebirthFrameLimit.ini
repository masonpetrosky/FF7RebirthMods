[FrameLimit]
; Frames per second the display shows, the ones frame generation makes included. This replaces the game's own
; frame-rate option (30, 60, 90 or 120), which limits rendered frames only. Without frame generation the game renders
; up to this many frames a second; with DLSS Frame Generation half as many, with NVIDIA's 3x or 4x override a third or
; a quarter (the add-on counts which). -1 = 3 below the refresh rate of the display the game is on (237 at 240 Hz,
; 141 at 144 Hz), which keeps a G-SYNC or FreeSync display in its variable refresh range. 0 = no limit.
Limit=-1
; 1 = use Limit, 0 = the game's own frame-rate option. The overlay's checkbox and ToggleKey switch it for the session.
Enabled=1
; Virtual-key code that switches between Limit and the game's own limit (33 = Page Up, 0 = none). Works while the game's
; window is in front and neither Alt nor Ctrl is held.
ToggleKey=0
; Testing: a second limit (shown frames per second) that ToggleKey also switches to: Limit, TestLimit, the game's.
; 0 = none.
TestLimit=0
; 1 = write the frame rates and the limit in use to ReShade.log every 5 seconds.
LogStats=0

; NVIDIA Reflex: the game runs it (Low Latency) only while DLSS frame generation is on. 1 = keep it on without frame
; generation too, 0 = the game's. The overlay's checkbox switches it for the session. Needs an NVIDIA GPU.
Reflex=1
; Virtual-key code that switches Reflex between the two for the session, for comparisons (0 = none).
ReflexKey=0
