[ShaderInjectorSync]
; When the game starts quickly it creates its Direct3D 12 device before Shader Injector has hooked Direct3D 12, and many
; of Shader Injector's shaders then stay the game's for that session. The add-on holds the game until Shader Injector's
; log says its hooks are enabled, at most this many seconds (Shader Injector needs about 6 s after the game starts).
; 0 = never wait.
WaitSeconds=15
